name: Disposable B20 quote probe

on:
  push:
    branches:
      - b20-quote-probe-20260825
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out probe branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install probe dependencies
        run: |
          python -m pip install --disable-pip-version-check requests
          npm install --no-save ethers@6

      - name: Call baseline public aggregator quote APIs
        run: python b20-probe/probe.py

      - name: Run corrected retries and package metadata checks
        run: python b20-probe/retry.py

      - name: Query current Velora widget package metadata
        run: python b20-probe/velora_metadata.py

      - name: Query Aerodrome contracts on Base
        run: node b20-probe/onchain.mjs

      - name: Benchmark Aerodrome at exact blocks and fee-adjusted amounts
        run: node b20-probe/benchmark.mjs

      - name: Upload immutable evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: b20-quote-evidence-${{ github.run_id }}
          path: results/*.json
          retention-days: 7

      - name: Commit exact response files to disposable branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/*.json
          git commit -m 'Record corrected B20 quote responses [skip ci]' || exit 0
          git push
